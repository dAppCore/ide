<!doctype html>

  <title>core/ide — Lethean-3 Lit shell</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/lethean-3/tokens.css">
  <style>
    html, body {
      margin: 0;
      height: 100vh;
      width: 100vw;
      background: #1a1620;
      color: var(--fg-1, #e5e5ee);
      font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, "SF Pro", "Inter", sans-serif);
      overflow: hidden;
    }
    body {
      display: grid;
      place-items: center;
      padding: 16px;
      box-sizing: border-box;
    }
    lethean-shell {
      width: 100%;
      height: 100%;
      max-width: 1600px;
      max-height: 1000px;
    }

    /* Responsive — same rules as a webapp; each Wails window is its own document */
    @media (max-width: 1024px) {
      lethean-vi-panel { display: none !important; }
      .sites-row { grid-template-columns: 1.4fr 80px 80px 90px !important; }
      .sites-row > div:nth-child(2) { display: none; } /* hide STACK column */
      .sites-row > div:nth-child(6) { display: none; } /* hide WARN column */
    }
    @media (max-width: 768px) {
      body { padding: 0; }
      lethean-shell { border-radius: 0; max-width: none; max-height: none; }
      .sites-row { grid-template-columns: 1fr 70px 70px !important; }
      .sites-row > div:nth-child(5) { display: none; } /* hide DEPLOY column */
    }
  </style>
</head>

    Promise.all([
      customElements.whenDefined('lethean-mac-segmented'),
      customElements.whenDefined('lethean-nav-item'),
      customElements.whenDefined('lethean-titlebar'),
      customElements.whenDefined('lethean-vi-overlay'),
    ]).then(() => {
      // Wire the Today / Sites / Activity segmented control to the active page
      const seg = document.getElementById('page-segmented');
      if (seg) {
        seg.items = ['Today', 'Sites', 'Activity'];
        seg.value = 'Today';
        seg.addEventListener('lethean-segmented-select', (e) => {
          const map = { Today: 'today', Sites: 'sites', Activity: 'activity' };
          showPage(map[e.detail.value] || 'today');
        });
      }

      // Wire sidebar navigation — clicks on nav items swap the page
      document.querySelectorAll('lethean-nav-item').forEach((it) => {
        it.addEventListener('lethean-nav-select', () => {
          const page = it.dataset.page;
          if (page) showPage(page);
        });
      });

      // Wire ⌘K + Ask Vi pill to open overlay
      const overlay = document.getElementById('vi-overlay');
      document.addEventListener('keydown', (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
          e.preventDefault();
          if (overlay) overlay.open = true;
        }
      });
      document.addEventListener('lethean-ask-vi', () => {
        if (overlay) overlay.open = true;
      });
    });

    function showPage(page) {
      const host = document.getElementById('page-host');
      if (!host) return;
      host.innerHTML = '';

      let el;
      if (page === 'today') {
        el = document.createElement('lethean-today-page');

      } else {
        el = document.createElement('lethean-today-page');
        page = 'today';
      }
      host.appendChild(el);

      // Sync titlebar title
      const tb = document.querySelector('lethean-titlebar');
      if (tb) tb.title = TITLES[page] || page.charAt(0).toUpperCase() + page.slice(1);

      // Sync sidebar active state
      document.querySelectorAll('lethean-nav-item').forEach((it) => {
        it.active = it.dataset.page === page;
      });

      // Sync segmented — set to current page if top-3, clear otherwise
      const seg = document.getElementById('page-segmented');
      if (seg) {
        const segMap = { today: 'Today', sites: 'Sites', activity: 'Activity' };
        seg.value = segMap[page] || '';
      }
    }
  </script>
</body>
</html>
