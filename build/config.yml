# This file contains the configuration for this project.
# When you update `info` or `fileAssociations`, run `wails3 task common:update:build-assets` to update the assets.
# Note that this will overwrite any changes you have made to the assets.
version: '3'

# This information is used to generate the build assets.
info:
  companyName: "Lethean Community Interest Company" # The name of the company
  productName: "Core IDE" # The name of the application
  productIdentifier: "com.lethean.core-ide" # The unique product identifier
  description: "Core IDE - Development Environment" # The application description
  copyright: "(c) 2026, Lethean Community Interest Company. EUPL-1.2" # Copyright text
  comments: "Host UK Core IDE" # Comments
  version: "0.0.1" # The application version

# Dev mode configuration
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 task common:install:frontend:deps
      type: once
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 build DEV=true
      type: blocking
    # Wait for vite to be reachable before launching the binary. Without
    # this the binary's 10-attempt × 500ms retry budget (5s) loses the
    # race against vite cold-start on first run, FATAL'ing with
    # "unable to connect to frontend server". wails3 dev's exec path
    # tokenises by whitespace (no shell), so we delegate to a script.
    - cmd: build/wait-for-vite.sh
      type: blocking
    - cmd: wails3 task run
      type: primary

